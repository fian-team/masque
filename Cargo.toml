[workspace]
members = [".", "web"]
# `web/` is the browser stage (docs/internal/WEB_STAGE.md); a bare
# `cargo build` / `cargo test` here stays this crate alone.
default-members = ["."]
resolver = "2"

[package]
name = "ogham"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Embeddable UI language and runtime for Rust applications: bytecode VM, reconciling widget tree, Skia rendering backend"
license = "MIT"
repository = "https://github.com/fian-team/ogham"
keywords = ["ui", "framework", "language", "flexbox"]
categories = ["gui"]

[[bin]]
name = "ogham-lsp"
path = "src/lsp/main.rs"

[[bin]]
name = "ogham-vocab"
path = "src/bin/vocab.rs"

[lib]
name = "ogham"
path = "src/lib.rs"

[dependencies]
downcast-rs = "2.0.1"
lodepng = "3.12.1"
nalgebra-glm = "0.19.0"

# The browser build (`web/`, docs/internal/WEB_STAGE.md) is emscripten:
# Skia without Vulkan, and none of the watcher or the LSP's runtime.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
skia-safe = { version = "0.91.0", features = ["vulkan", "textlayout"] }
notify = "6.1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[target.'cfg(target_os = "emscripten")'.dependencies]
skia-safe = { version = "0.91.0", features = ["textlayout"] }

[dev-dependencies]
# The browser stage's build (`web/build.sh`): size over compile time.
[profile.stage]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
