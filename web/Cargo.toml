[package]
name = "masque-web"
version = "0.0.0"
edition = "2021"
publish = false
description = "The browser stage: Masque's VM and Skia raster renderer behind a C-shaped API for emscripten"

[lib]
name = "masque_web"
path = "src/lib.rs"

# The emscripten build of this binary is the stage: `masque_stage.js` +
# `masque_stage.wasm` (`web/build.sh`). Natively it does nothing; the
# library's tests are the native half.
[[bin]]
name = "masque_stage"
path = "src/main.rs"

[dependencies]
masque = { path = ".." }
